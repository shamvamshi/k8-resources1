apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment-demo
  labels: # this is deployment labels
    project: roboshop
    environment: dev
spec:
  replicas: 3
  selector:
    matchLabels:
      project: roboshop
      environment: dev
  template:
    metadata:
      labels:
        project: roboshop
        environment: dev
    spec:
      containers:
      - name: nginx
        image: nginx:stable-pearl
